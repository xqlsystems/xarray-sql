[package]
name = "xarray_sql"
version = "0.6.0"
authors = ["Alex Merose"]
edition = "2021"
exclude = [
    "perf_tests/*",
    "demo/*",
    ".github/*",
    ".idea/*",
    ".claude/*",
    ".pre-commit-config.yaml",
    ".python-version",
    "CONTRIBUTING.md",
    "MANIFEST.in",
    "uv.lock",
    "xarray_sql/*_test.py",
]

[dependencies]
arrow = { version = "59", features = ["pyarrow"] }
arrow-flight = { version = "59", features = ["flight-sql"], optional = true }
async-stream = "0.3"
async-trait = "0.1"
datafusion = { version = "55.1.0", default-features = false }
datafusion-ffi = { version = "55.1.0" }
futures = { version = "0.3" }
half = "2.7"
prost = { version = "0.14", optional = true }
# `abi3-py310` builds against CPython's stable ABI, so a single wheel per
# platform works on all CPython >= 3.10 (matching `requires-python`). Maturin
# enables `pyo3/extension-module` through pyproject.toml for wheel builds; it
# must stay disabled for ordinary Cargo test binaries so they link libpython.
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
tokio = { version = "1.46.1", features = ["macros", "rt", "sync", "time"] }
tonic = { version = "0.14", features = ["transport"], optional = true }

[features]
default = ["flight"]
# The Arrow Flight SQL server needs TCP sockets and OS threads, neither of
# which exist under WebAssembly. Pyodide builds disable default features.
# The server plans SQL, so it also needs DataFusion's default features
# (SQL, function libraries, Parquet, compression).
flight = ["dep:arrow-flight", "dep:prost", "dep:tonic", "datafusion/default", "tokio/net", "tokio/rt-multi-thread"]


# Pyodide downloads the wheel on every page load, so wasm builds trade
# speed for size: `MATURIN_PEP517_ARGS="--no-default-features --profile wasm"`.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
pyo3-build-config = "0.29"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "xarray_sql"
crate-type = ["cdylib", "rlib"]
