[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "xarray_sql"
dynamic = ["version"]
description = "Query Xarray with SQL."
readme = "README.md"
requires-python = ">=3.10"  # Python 3.9 EOL is October 31, 2025.
license = {text = "Apache-2.0"}
authors = [
  {name = "Alexander Merose", email = "al@merose.com"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Database :: Front-Ends",
]
dependencies = [
    # This needs to match the cargo datafusion version!! DataFusion's Python
    # bindings have no Pyodide wheels, so they are optional there.
    "datafusion==55.0.0; sys_platform != 'emscripten'",
    "pyarrow>=16.0.0",
    "xarray>=2024.7.0",
]

[project.optional-dependencies]
# Lazy, chunked results from `to_dataset(chunks=...)` need a chunk manager.
dask = [
  "dask>=2024.8.0",
]
adbc = [
  # Plus a driver package for your database, e.g. adbc-driver-postgresql.
  "adbc-driver-manager>=1.12",
]
duckdb = [
  "duckdb>=1.4.0",
]
polars = [
  # collect(engine="streaming") landed in polars 1.25;
  # LazyFrame.collect_batches (streamed max_result_bytes enforcement)
  # in 1.33. PolarsHandle degrades gracefully below both floors.
  "polars>=1.33",
]
geo = [
  "pyproj",
]
# Gradients in SQL: grad(), vjp() and jvp() from ddx. ddxdb is pre-1.0
# and breaks its API between minor versions. It reads and writes the
# Substrait of DataFusion 55, so bump it together with that pin.
ml = [
  "ddxdb>=0.4.6,<0.5; sys_platform != 'emscripten'",
]
test = [
  "adbc-driver-flightsql>=1.12",
  "adbc-driver-sqlite>=1.12",
  "cftime",
  "xarray-sql[adbc,dask,duckdb,polars,geo,ml]",
  "pytest",
  "xarray[io]",
  "gcsfs",
]
docs = [
    "zensical",
    "mkdocstrings[python]",
]
dev = [
    "xarray_sql[docs]",
    "pre-commit",
    "pytest",
    "watchfiles",
]

[project.urls]
Homepage = "https://github.com/alxmrs/xarray-sql"
Issues = "https://github.com/alxmrs/xarray-sql/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "xarray_sql._native"

[tool.setuptools.packages.find]
exclude = ["demo", "perf_tests", "tests", "tests.*"]

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
follow_imports = "skip"
exclude = [
    "perf_tests/",
    "xarray_sql.egg-info/",
    "^\\.venv/",
]

# Per-module ignores for libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
    "datafusion.*",
    "xarray.*",
    "pandas.*",
    "cftime.*",
    "xarray_sql._native",
]
ignore_missing_imports = true

[tool.setuptools_scm]

[dependency-groups]
dev = [
    "xarray_sql[test]",
    "xarray_sql[docs]",
    "py-spy>=0.4.0",
    "ruff>=0.15.10",
    "maturin>=1.9.1",
    # The ML demos: ddx's DuckDB backend, at the DuckDB it declares;
    # einfold, a query optimizer for DataFusion that runs tensor
    # computations in SQL with array algorithms; and JAX, which the demos
    # check their results against.
    "ddxdb[duckdb]>=0.4.6,<0.5; sys_platform != 'emscripten'",
    # TODO(xqlsystems/einfold#118): install einfold on Windows too, once
    # it publishes a Windows wheel; until then it would build from source.
    "einfold[datafusion]>=0.1.0rc2,<0.2; sys_platform != 'emscripten' and sys_platform != 'win32'",
    # jaxlib publishes no wheels for Intel macOS, so the demos skip there.
    "jax; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv]
# Rebuild package when any rust files change
cache-keys = [{file = "pyproject.toml"}, {file = "rust/Cargo.toml"}, {file = "**/*.rs"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs network (anonymous GCS); excluded from the CI unit run",
]
