name: ci

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: "python ${{ matrix.python-version }} tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
        ]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-cache-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

        # Use the --no-install-package to only install the dependencies
        # but do not yet build the rust library
      - name: Install xarray_sql
        run: uv sync --locked --dev --no-install-package xarray-sql
      - name: build rust
        run: uv run --no-project maturin develop --uv
      - name: Install in-process ADBC drivers
        # chDB (embedded ClickHouse) and DataFusion run the ADBC adapter's
        # contract tests without a server. dbc installs into the active
        # virtualenv.
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          uv pip install dbc
          uv run --no-project dbc install "chdb=26.7.0"
          uv run --no-project dbc install "datafusion=0.27.0"
      - name: Run unit tests
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        # The ML demos run in their own job, below. --benchmark-disable runs
        # each benchmark once, as a test, so a PR that breaks one fails here
        # rather than in the benchmarks job on main.
        run: uv run --no-project pytest -v . -m "not integration" --benchmark-disable --ignore=tests/test_ml_demos.py

  ml-demos:
    # Each ML demo in benchmarks/ml, at its smallest size, checked against
    # JAX (tests/test_ml_demos.py).
    name: "ml demos"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-cache-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install xarray_sql
        run: uv sync --locked --dev --extra test --no-install-package xarray-sql
      - name: build rust
        run: uv run --no-project maturin develop --uv
      - name: Run the demos
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: uv run --no-project pytest -v tests/test_ml_demos.py

  benchmarks:
    # tests/test_benchmarks.py, timed with pytest-benchmark (a pytest
    # plugin that runs a function repeatedly and reports its timings) and
    # stored on gh-pages by github-action-benchmark (an action that keeps
    # each run's results as a history, charts it, and comments on a commit
    # that looks like a regression).
    name: "benchmarks"
    runs-on: ubuntu-latest
    # Only on main: a PR from a fork has no permission to push to
    # gh-pages, and a dispatch from another branch shouldn't record a
    # point into history that doesn't belong to main's timeline.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        id: rust-toolchain

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-cache-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install xarray_sql
        run: uv sync --locked --dev --extra benchmark --no-install-package xarray-sql
      - name: build rust
        run: uv run --no-project maturin develop --uv
      - name: Run benchmarks
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: uv run --no-project pytest tests/test_benchmarks.py -m benchmark --benchmark-only --benchmark-json=benchmark.json
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "Python benchmarks (pytest-benchmark)"
          tool: "pytest"
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The action retries a push that gh-pages rejects (up to 10 times,
          # re-cloning gh-pages each time), so it can share the branch with
          # mike's pushes from docs.yml. A new point goes live when docs.yml
          # next publishes gh-pages to Pages, which may be one push to main
          # later if that publish checked out gh-pages before this push.
          auto-push: true
          # mike (docs.yml) owns dev/, 0.x/, latest/, index.html and
          # versions.json on gh-pages, and replaces dev/ wholesale on
          # every docs deploy; the default dev/bench would collide
          # with that and get wiped out. Use a root-level path mike
          # never touches.
          benchmark-data-dir-path: benchmarks
          # Hosted runners are noisy; keep this loose until there's
          # enough history on gh-pages to pick a tighter threshold.
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false
