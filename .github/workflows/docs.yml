name: Build documentation

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Docs version to deploy (e.g. 0.3), built from the selected ref"
        required: true
        type: string
      latest:
        description: "Point the 'latest' alias (public default) at this version"
        required: false
        type: boolean
        default: false

concurrency:
  group: "docs"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve docs version
        id: docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            latest="$INPUT_LATEST"
          elif [[ "$EVENT_NAME" == "release" ]]; then
            # v0.4.0-rc.1 -> 0.4; pre-releases never move the 'latest' alias
            version="$(echo "${RELEASE_TAG#v}" | cut -d. -f1,2)"
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              latest="false"
            else
              latest="true"
            fi
          else
            version="dev"
            latest="false"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

      - name: Deploy documentation version
        env:
          VERSION: ${{ steps.docs.outputs.version }}
          LATEST: ${{ steps.docs.outputs.latest }}
        run: |
          mike() {
            uvx --from git+https://github.com/squidfunk/mike.git \
              --with "mkdocstrings[python]" mike "$@"
          }
          if [[ "$LATEST" == "true" ]]; then
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push "$VERSION"
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Check a default version exists
        id: bootstrapped
        run: |
          # The root redirect only exists once a stable version has been
          # deployed and set as default; until then, keep serving the
          # previously published site instead of a broken root
          if [[ -f index.html ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "No default docs version set yet; skipping Pages publish" >&2
          fi

      - name: Upload artifact
        if: steps.bootstrapped.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.bootstrapped.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
